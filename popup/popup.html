<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LeetBridge</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <h1>LeetBridge</h1>

    <p id="status">
         Checking...
    </p>

    <dl id="details" hidden>
        <div>
            <dt>Current Problem</dt>
            <dd id="problem">Not detected</dd>
        </div>
        <div>
            <dt>LeetCode User</dt>
            <dd id="username">Not detected</dd>
        </div>
        <div>
            <dt>Submission</dt>
            <dd id="submission">No submission yet</dd>
        </div>
        <div>
            <dt>Solution</dt>
            <dd id="solution">Waiting for submission</dd>
        </div>
    </dl>

    <script src="popup.js"></script>

</body>
</html>
